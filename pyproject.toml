[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dostuff"
version = "0.2.2"
description = "DoStuff - a terminal coding agent for any LLM: TUI and headless mode, permissions, MCP, skills, web tools, sessions and git worktrees"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Varun Kumawat", email = "varunkumawatleap2@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.9.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "litellm>=1.0",
    "httpx>=0.27",
    # mcp>=2 uses httpx2; lib/mcp/mcp_client.py imports it directly
    "httpx2>=2.12",
    "pkce>=1.0",
    "mcp>=2.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "textual>=0.50.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    # MCP OAuth tokens persist in the OS keyring; without it every start opens the browser
    "keyring>=24",
]

[project.urls]
Homepage = "https://github.com/kVarunkk/DoStuff"
Repository = "https://github.com/kVarunkk/DoStuff"
Issues = "https://github.com/kVarunkk/DoStuff/issues"

[project.scripts]
dostuff = "dostuff.cli:app"

[project.optional-dependencies]
# Long-term memory (save_memory / save_episode, recall) and semantic MCP tool search.
# Large install (onnxruntime and friends), so it's opt-in.
memory = [
    "chromadb>=1.5.0",
]
# Steadier web_search (several engines); without it web_search reads DuckDuckGo's HTML page
search = [
    "ddgs>=9.0",
]
full = [
    "dostuff[memory,search]",
    "onnxruntime>=1.16",
    "grpcio>=1.52",
]
dev = [
    "pytest>=8",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dostuff*"]
exclude = ["dostuff.tests*"]

[tool.setuptools.package-data]
# Templates used by `dostuff setup` (read with importlib.resources)
dostuff = ["templates/*"]
