[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dostuff"
version = "0.1.2"
description = "DoStuff - AI agent harness with global CLI, pipx install, and persistent session storage"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Varun Kumawat", email = "varunkumawatleap2@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.9.0",
    "aiosqlite>=0.19.0",
    "chromadb>=1.5.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "litellm>=1.0",
    "httpx>=0.27",
    "pkce>=1.0",
    "mcp>=1.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "textual>=0.50.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]

[project.urls]
Homepage = "https://github.com/kVarunkk/DoStuff/blob/package-structure/README.md"
Repository = "https://github.com/kVarunkk/DoStuff"
Issues = "https://github.com/kVarunkk/DoStuff/issues"

[project.scripts]
dostuff = "dostuff.cli:app"

[project.optional-dependencies]
full = [
    "onnxruntime>=1.16",
    "grpcio>=1.52",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dostuff*"]
exclude = ["dostuff.tests*"]
