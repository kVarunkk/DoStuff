name: CI

on:
  push:
    branches: [main, package-structure]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # pyproject.toml: requires-python >= 3.11
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,memory,docs,images]"
      - name: Type check
        run: python -m mypy dostuff --ignore-missing-imports
      - name: Tests
        run: python -m pytest -q tests
        env:
          # tests that need an extra fail instead of skipping (tests/conftest.py requires_extra)
          DOSTUFF_REQUIRE_EXTRAS: "1"
