# Labelled recall set for tests/test_memory_recall_eval.py (spec: plan/2026-11-11-memory-recall, evals.md T1).
#
# Seeded memory, then prompts with what must / must not reach the model.
# Labels: "f:<key>" is a fact by key; "e:<text>" an episode whose anchor contains <text> ("e:" = any episode).
# Projects A and B have facts and episodes, C has none. A delivered label owned by another project is a leak.
user_facts:
- key: name
  value: Prefers to be called Admiral Nemo
- key: preferred_language
  value: Writes new standalone programs and snippets in Rust
- key: test_framework
  value: Uses pytest, never unittest
- key: commit_style
  value: Conventional commits, all lowercase
- key: shell
  value: On Windows; wants PowerShell for shell commands
- key: editor
  value: Uses Neovim
- key: explanation_style
  value: Keep explanations to three sentences unless asked for more
- key: timezone
  value: Lives in IST (UTC+5:30)
project_facts:
  A:
  - key: linter
    value: Use ruff instead of flake8 in this project; flake8 clashed with black
  - key: docs_package_manager
    value: The docs site uses pnpm, not npm
  B:
  - key: linter_b
    value: This project lints with flake8 only; CI rejects ruff
  - key: db
    value: Staging uses PostgreSQL 16
episodes:
  A:
  - type: DECISION
    days_old: 120
    anchor: Enabled WAL journal mode for the tinykv Store's SQLite database
    summary: Readers were blocked by writers; chose PRAGMA journal_mode=WAL; every connection must keep it.
  - type: LEARNING
    days_old: 45
    anchor: '''database is locked'' in tests fixed with a busy timeout'
    summary: 'Two Store objects writing at once raised sqlite3.OperationalError: database is locked; timeout=5 fixed it.'
  - type: EVENT
    days_old: 3
    anchor: CI flaked on macOS runners
    summary: Two macOS jobs failed and passed on re-run.
  - type: DECISION
    days_old: 200
    anchor: Switched the docs theme to furo
    summary: Switched the docs theme to furo.
  - type: EVENT
    days_old: 30
    anchor: Bumped requests to 2.32
    summary: Bumped requests to 2.32.
  - type: LEARNING
    days_old: 60
    anchor: Paths with spaces broke the release script on Windows; quoted them
    summary: Quoted all paths.
  - type: DECISION
    days_old: 90
    anchor: Use hatchling as the build backend
    summary: Use hatchling as the build backend.
  - type: CORRECTION
    days_old: 15
    anchor: User wants f-strings, not str.format
    summary: User corrected str.format to f-strings.
  - type: LEARNING
    days_old: 25
    anchor: argparse subparsers need dest= to know which command ran
    summary: Set dest='cmd'.
  - type: DECISION
    days_old: 70
    anchor: Log with the stdlib logging module, no third-party logger
    summary: No loguru.
  - type: LEARNING
    days_old: 100
    anchor: json.dump needs ensure_ascii=False for non-ASCII titles
    summary: Titles were escaped.
  - type: DECISION
    days_old: 140
    anchor: Support Python 3.11 and newer only
    summary: Dropped 3.10.
  - type: LEARNING
    days_old: 33
    anchor: Store timestamps in UTC and convert only for display
    summary: Mixed zones broke sorting.
  - type: DECISION
    days_old: 80
    anchor: CLI output is plain text, no colours
    summary: Colours broke piping.
  - type: LEARNING
    days_old: 150
    anchor: A .gitattributes eol=lf stopped CRLF churn in diffs
    summary: Windows checkouts churned.
  - type: DECISION
    days_old: 55
    anchor: Keep tinykv single-file; no server mode
    summary: Scope decision.
  # Recent everyday events about the same SQLite file (memory recall T2.3): they compete with the old WAL decision,
  # so a flat decay pushes the decision out of the top 3 and D9's per-type decay keeps it
  - type: EVENT
    days_old: 1
    anchor: Opened tinykv.db in DB Browser for SQLite to look at the rows
    summary: Inspected the kv table by hand.
  - type: EVENT
    days_old: 2
    anchor: Copied the tinykv.db SQLite file to a backup folder
    summary: Backup before a refactor.
  - type: EVENT
    days_old: 4
    anchor: The tinykv.db SQLite database grew to 40 MB in the load test
    summary: Load test with a million keys.
  - type: EVENT
    days_old: 5
    anchor: Ran VACUUM on the tinykv.db SQLite database
    summary: Reclaimed space after the load test.
  B:
  - type: DECISION
    days_old: 40
    anchor: Pinned flake8 to 7.0 because plugins broke on 7.1
    summary: flake8-bugbear failed on 7.1.
  - type: LEARNING
    days_old: 20
    anchor: Docker build cache was busted by an early COPY .; moved it after installing deps
    summary: Builds went from 6 min to 40 s.
  - type: CORRECTION
    days_old: 10
    anchor: Never auto-format generated files under gen/
    summary: User reverted a formatted gen/ file.
  - type: DECISION
    days_old: 75
    anchor: Moved CI from Jenkins to GitHub Actions
    summary: Jenkins upkeep was too high.
